<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282420" />
      <stop offset="50%" stop-color="#181412" />
      <stop offset="100%" stop-color="#0a0908" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ff793f" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ff793f" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad2)" />
  <rect width="600" height="800" fill="url(#glow2)" />
  
  <!-- Framing Border -->
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <rect x="36" y="36" width="528" height="728" fill="none" stroke="rgba(255,121,63,0.2)" stroke-width="1" />

  <!-- Center Graphic: Guitar Motif -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="0" r="110" fill="rgba(255, 121, 63, 0.08)" stroke="#ff793f" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    
    <!-- Stylized Guitar Pick & Strings -->
    <path d="M 0 -55 C 45 -55, 55 15, 0 60 C -55 15, -45 -55, 0 -55 Z" fill="#1e1814" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="0" cy="-5" r="14" fill="#ff793f" />
    <line x1="-12" y1="-35" x2="-12" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="0" y1="-45" x2="0" y2="45" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
    <line x1="12" y1="-35" x2="12" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="300" y="520" text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="4">URITO SATO</text>
  <text x="300" y="565" text-anchor="middle" fill="#ff793f" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" letter-spacing="4">Gt.</text>
  
  <rect x="200" y="610" width="200" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="300" y="631" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2">PHOTO COMING SOON</text>

  <!-- Corner Brand -->
  <text x="50" y="65" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="2">FOURIA // MEMBER 02</text>
</svg>
