<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242834" />
      <stop offset="50%" stop-color="#14161d" />
      <stop offset="100%" stop-color="#0a0b0f" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ff3344" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad1)" />
  <rect width="600" height="800" fill="url(#glow1)" />
  
  <!-- Framing Border -->
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <rect x="36" y="36" width="528" height="728" fill="none" stroke="rgba(255,51,68,0.2)" stroke-width="1" />

  <!-- Center Graphic: Microphone / Music Motif -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="0" r="110" fill="rgba(255, 51, 68, 0.08)" stroke="#ff3344" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    
    <!-- Stylized Studio Mic -->
    <rect x="-22" y="-55" width="44" height="70" rx="22" fill="#181a22" stroke="#ffffff" stroke-width="3.5" />
    <line x1="-16" y1="-25" x2="16" y2="-25" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
    <line x1="-16" y1="-5" x2="16" y2="-5" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
    <path d="M -36 -10 C -36 35, 36 35, 36 -10" fill="none" stroke="#ff3344" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="35" x2="0" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="-28" y1="65" x2="28" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="300" y="520" text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="4">KOBA YU</text>
  <text x="300" y="565" text-anchor="middle" fill="#ff4757" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" letter-spacing="4">Vo. / Key. / Gt.</text>
  
  <rect x="200" y="610" width="200" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="300" y="631" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2">PHOTO COMING SOON</text>

  <!-- Corner Brand -->
  <text x="50" y="65" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="2">FOURIA // MEMBER 01</text>
</svg>
